name: "CI Windows"

on:
    pull_request:
    push:
        branches:
            - '1.x'
    schedule:
        -   cron: '0 0 * * *'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

env:
    SYMFONY_PHPUNIT_DIR: "$HOME/symfony-bridge/.phpunit"
    # no mercure hub / browser driver on the Windows runners; the
    # docker-database compose validation self-skips (no docker compose)
    MAKER_SKIP_MERCURE_TEST: 1
    MAKER_SKIP_PANTHER_TEST: 1
    MAKER_DISABLE_FILE_LINKS: 1
    # Windows-specific bugs live in the maker's I/O layer, which the
    # #[WindowsSmoke] subset exercises end-to-end; the runtime behavior of
    # generated code is OS-independent and Linux executes all of it on
    # three Symfony versions
    MAKER_WINDOWS_SMOKE: 1

jobs:
    tests:
        name: Testing on Windows
        runs-on: [windows-latest]
        strategy:
            fail-fast: false
            matrix:
                php-versions: ['8.2']
                dependency-versions: ['highest']
        steps:
            # This is needed in Windows, otherwise assertions comparing fixtures and generated code will fail.
            - name: Use INPUT for autocrlf in Git Config
              run: git config --global core.autocrlf input

            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: pdo, pdo_sqlite

            - name: Install Node (Stimulus executor toolchain)
              uses: actions/setup-node@v5
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: tests/Harness/js/package-lock.json

            - name: Composer Install
              uses: "ramsey/composer-install@v4"
              with:
                  dependency-versions: "${{ matrix.dependency-versions }}"

            - name: Composer install twigcs
              uses: "ramsey/composer-install@v4"
              with:
                  composer-options: "--no-scripts --working-dir=tools/twigcs"

            - name: Composer install paratest-legacy
              uses: "ramsey/composer-install@v4"
              with:
                  composer-options: "--no-scripts --working-dir=tools/paratest-legacy"

            - name: Install PHPUnit
              run: vendor/bin/simple-phpunit install
              env:
                  PHPUNIT_VERSION: '9.6'

            - name: Compute app cache key
              id: apps-cache-key
              shell: bash
              run: |
                  echo "epoch=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
                  echo "inputs=${{ hashFiles('composer.json', 'composer.lock', 'tests/Harness/Application/**', 'tests/Harness/resources/**', 'tests/Harness/js/package-lock.json') }}" >> "$GITHUB_OUTPUT"

            - name: Cache generated-app skeleton + profiles
              uses: actions/cache@v5
              with:
                  path: |
                      tests/tmp/skeleton
                      tests/tmp/profiles
                  key: apps-v1-${{ runner.os }}-${{ runner.arch }}-php${{ matrix.php-versions }}-sflatest-${{ matrix.dependency-versions }}-${{ steps.apps-cache-key.outputs.epoch }}-${{ steps.apps-cache-key.outputs.inputs }}
                  restore-keys: |
                      apps-v1-${{ runner.os }}-${{ runner.arch }}-php${{ matrix.php-versions }}-sflatest-${{ matrix.dependency-versions }}-${{ steps.apps-cache-key.outputs.epoch }}-
                      apps-v1-${{ runner.os }}-${{ runner.arch }}-php${{ matrix.php-versions }}-sflatest-${{ matrix.dependency-versions }}-

            - name: Build app skeleton + profiles
              run: composer test:apps:build

            - name: Run unit tests
              run: vendor/bin/simple-phpunit --testsuite=unit

            - name: Run maker tests (paratest-legacy -p 4)
              # paratest 6's WrapperRunner is not supported on Windows, so
              # this uses the default per-class runner
              run: tools/paratest-legacy/vendor/bin/paratest --testsuite=makers -p 4
