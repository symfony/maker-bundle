name: "CI Static Analysis"

on:
    pull_request:
    push:
        branches:
            - '1.x'
    schedule:
        -   cron: '0 0 * * *'

env:
    PHPUNIT_FLAGS: "-v"
    SYMFONY_PHPUNIT_DIR: "$HOME/symfony-bridge/.phpunit"

jobs:
    composer-validate:
        name: "Validate composer.json"

        runs-on: ubuntu-latest

        steps:
            -
                name: Checkout code
                uses: "actions/checkout@v4"

            -
                name: Validate composer.json
                run: "composer validate --strict --no-check-lock"

    phpstan:
        name: "PHPStan (PHP ${{ matrix.php-version }} + Symfony ${{ matrix.symfony-version }})"

        runs-on: ubuntu-latest

        env:
            SYMFONY_REQUIRE: ${{ matrix.symfony-version }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    # the lowest supported versions of PHP and Symfony
                    - php-version: '8.2'
                      symfony-version: '7.4.*'
                      phpstan-config: 'tools/phpstan/symfony-7.4.neon'
                    # the latest Symfony version, on the lowest PHP version it supports
                    - php-version: '8.4'
                      symfony-version: '8.2.*'
                      phpstan-config: 'phpstan.dist.neon'

        steps:
            -   name: Checkout
                uses: "actions/checkout@v4"

            -   name: Install PHP
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: ${{ matrix.php-version }}
                    tools: flex

            -   name: Install Composer Dependencies
                uses: "ramsey/composer-install@v3"
                with:
                    composer-options: "--no-scripts"

            -   name: Install PHPStan
                uses: "ramsey/composer-install@v3"
                with:
                    composer-options: "--no-scripts --working-dir=tools/phpstan"

            -   name: Install Optional Dependencies
                uses: "ramsey/composer-install@v3"
                with:
                    composer-options: "--no-scripts --working-dir=tools/phpstan/includes"

            -   name: Install PHPUnit
                run: "vendor/bin/simple-phpunit --version"

            -   name: Run PHPStan
                run: "tools/phpstan/vendor/bin/phpstan analyze --configuration=${{ matrix.phpstan-config }} --memory-limit=1G --error-format=github"
